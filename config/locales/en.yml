    paragraph: "Enter a long URL, create a short one, and share it anywhere — no account needed."
    
    feature1:
      heading: "Free"
      paragraph: "Create as many short URLs as you like. No signup, no fees."
      
    feature2:
      heading: "Fast"
      paragraph: "Lookups are indexed for speed. <a href='#' data-bs-toggle='modal' data-bs-target='#optimizedBackendModal'>Learn more.</a>"
      
    feature3:
      heading: "Statistics"
      paragraph: "Every click is tracked and updates in realtime. <a href='#' data-bs-toggle='modal' data-bs-target='#trackLinkClicks'>Track a short URL.</a>"
      
    feature4:
      heading: "Easy"
      paragraph: "Paste the long URL, hit create, and you're done."
      
