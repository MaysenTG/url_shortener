      paragraph: "We implement many techniques to speed up your short URL lookups.<br/><br/><h4>Database indexing</h4><ul><li>Short codes use a unique covering index so lookups stay fast as the table grows.</li></ul><br/><h4>Async click recording</h4><ul><li>Redirects return immediately; clicks are recorded in a background job with atomic counters and an event log.</li></ul><br/><h4>Realtime stats</h4><ul><li>ActionCable streams live totals, with JSON polling as a fallback when the socket drops.</li></ul>"

